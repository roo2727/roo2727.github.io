<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- LIFE 임시 일러스트 (day). 실제 리소스가 준비되면 js/config/illustration.js 에서 경로만 교체 -->
  <defs>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db7c9"/>
      <stop offset="1" stop-color="#7c97ad"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8f86"/>
      <stop offset="1" stop-color="#4d5d55"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffe39a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe39a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- 원경: 떠 있는 섬과 성 -->
  <g opacity="0.92">
    <path fill="url(#rock)" d="M300 560 C340 540 380 548 420 540 C470 530 520 548 580 540 C630 534 660 548 690 560 L680 600 C670 650 640 700 600 740 C560 780 520 790 490 800 C460 790 430 770 400 740 C360 700 330 650 310 600 Z"/>
    <g fill="#a7bccc">
      <path d="M380 440 L395.0 400 L410 440 Z"/><rect x="380" y="440" width="30" height="120"/><path d="M440 390 L462.0 330 L484 390 Z"/><rect x="440" y="390" width="44" height="170"/><path d="M494 430 L510.0 380 L526 430 Z"/><rect x="494" y="430" width="32" height="140"/><path d="M548 450 L562.0 410 L576 450 Z"/><rect x="548" y="450" width="28" height="110"/><path d="M590 470 L603.0 440 L616 470 Z"/><rect x="590" y="470" width="26" height="90"/><path d="M415 455 L426.0 420 L437 455 Z"/><rect x="415" y="455" width="22" height="100"/>
      <rect x="370" y="520" width="270" height="40"/>
    </g>
    <g fill="#fff1b8" filter="url(#soft)"><rect x="392" y="470" width="5" height="10" rx="2.5"/><rect x="412" y="470" width="5" height="10" rx="2.5"/><rect x="452" y="430" width="5" height="10" rx="2.5"/><rect x="472" y="430" width="5" height="10" rx="2.5"/><rect x="500" y="455" width="5" height="10" rx="2.5"/><rect x="520" y="455" width="5" height="10" rx="2.5"/><rect x="560" y="480" width="5" height="10" rx="2.5"/><rect x="430" y="520" width="5" height="10" rx="2.5"/><rect x="480" y="515" width="5" height="10" rx="2.5"/><rect x="540" y="520" width="5" height="10" rx="2.5"/><rect x="600" y="525" width="5" height="10" rx="2.5"/></g>
    <g fill="#fff1b8"><rect x="392" y="470" width="5" height="10" rx="2.5"/><rect x="412" y="470" width="5" height="10" rx="2.5"/><rect x="452" y="430" width="5" height="10" rx="2.5"/><rect x="472" y="430" width="5" height="10" rx="2.5"/><rect x="500" y="455" width="5" height="10" rx="2.5"/><rect x="520" y="455" width="5" height="10" rx="2.5"/><rect x="560" y="480" width="5" height="10" rx="2.5"/><rect x="430" y="520" width="5" height="10" rx="2.5"/><rect x="480" y="515" width="5" height="10" rx="2.5"/><rect x="540" y="520" width="5" height="10" rx="2.5"/><rect x="600" y="525" width="5" height="10" rx="2.5"/></g>
    <!-- 다리 -->
    <path fill="#a7bccc" d="M640 520 H900 V545 H640 Z M660 545 v40 a18 18 0 0 1 36 0 v-40 Z M720 545 v40 a18 18 0 0 1 36 0 v-40 Z M780 545 v40 a18 18 0 0 1 36 0 v-40 Z M840 545 v40 a18 18 0 0 1 36 0 v-40 Z"/>
    <!-- 폭포 -->
    <rect x="455" y="560" width="16" height="260" fill="url(#fall)"/>
    <rect x="520" y="560" width="10" height="220" fill="url(#fall)"/>
    <rect x="600" y="560" width="12" height="200" fill="url(#fall)"/>
  </g>

  <!-- 떠 있는 수정 + 고리 (아스트롤라베) -->
  <g transform="translate(250 300)">
    <circle r="90" fill="url(#halo)"/>
    <ellipse rx="58" ry="22" fill="none" stroke="#c99a3e" stroke-width="3" transform="rotate(-20)"/>
    <ellipse rx="52" ry="52" fill="none" stroke="#c99a3e" stroke-width="2.5" opacity="0.8"/>
    <path d="M0 -40 L18 0 L0 40 L-18 0 Z" fill="#fff6d0" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M0 -70 V-52 M0 52 V80" stroke="#c99a3e" stroke-width="3"/>
  </g>

  <!-- 우측 고대 유적 기둥 -->
  <path fill="url(#near)" d="M860 0 H1000 V1000 H880 V420 C880 360 920 330 940 330 C960 330 960 360 960 400 V0 Z" opacity="0.95"/>
  <path fill="none" stroke="#fff4d6" stroke-width="2" opacity="0.6" d="M880 1000 V420 C880 360 920 330 940 330"/>

  <!-- 근경: 캐릭터가 앉을 바위 -->
  <path fill="url(#near)" d="M520 1000 L540 820 C560 790 620 780 700 785 C780 790 860 800 900 830 L920 1000 Z"/>
  <path fill="none" stroke="#fff4d6" stroke-width="2" opacity="0.7" d="M540 820 C560 790 620 780 700 785 C780 790 860 800 900 830"/>

  <!-- 캐릭터 자리 표시 -->
  <g opacity="0.7">
    <rect x="610" y="470" width="230" height="300" rx="24" fill="none" stroke="#fff4d6" stroke-width="2" stroke-dasharray="10 10"/>
    <text x="725" y="612" text-anchor="middle" font-family="Georgia, serif" font-size="20" letter-spacing="4" fill="#fff4d6">CHARACTER</text>
    <text x="725" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="3" fill="#fff4d6">PLACEHOLDER</text>
  </g>
</svg>
