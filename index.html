<!doctype html>
<html lang="ko" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LIFE — RPG 타이틀 화면 콘셉트의 자기소개 포트폴리오">
  <title data-i18n="meta.title">LIFE — 포트폴리오</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Gowun+Batang:wght@400;700&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/title.css">

  <!-- 저장된 테마·언어를 첫 렌더 전에 적용 -->
  <script src="js/core/storage.js"></script>
  <script src="js/core/boot.js"></script>
</head>
<body class="page-title">

  <!-- ===== 배경 세계 (장식) ===== -->
  <div class="world" aria-hidden="true">
    <div class="sky sky--day">
      <div class="sun"><div class="sun__rays"></div><div class="sun__core"></div></div>
      <div class="cloud cloud--1"></div>
      <div class="cloud cloud--2"></div>
      <div class="cloud cloud--3"></div>
      <div class="cloud cloud--4"></div>
    </div>
    <div class="sky sky--night">
      <div class="moon"><div class="moon__glow"></div><div class="moon__body"></div></div>
      <div class="mist mist--1"></div>
      <div class="mist mist--2"></div>
    </div>
    <div class="horizon"></div>
  </div>

  <canvas class="particles" id="particles" aria-hidden="true"></canvas>

  <!-- ===== 우측 일러스트 영역: js/config/illustration.js 에서 리소스 지정 ===== -->
  <div class="illustration" id="illustration" aria-hidden="true"></div>

  <div class="veil" aria-hidden="true"></div>

  <!-- ===== 타이틀 UI ===== -->
  <main class="title-ui">

    <h1 class="logo" id="logo">
      <span class="visually-hidden">LIFE</span>

      <!-- 레이어 로고: 730 × 270 공통 좌표계. 모든 레이어는 같은 캔버스 크기로
           겹쳐 있으며(투명 여백 유지), 각각 독립적으로 애니메이션한다. -->
      <span class="logo__stage" aria-hidden="true">
        <!-- day: 레이어 순서는 리소스 README 의 합성 순서를 따른다 -->
        <span class="logo__theme logo__theme--day only-day">
          <svg class="logo__layer logo__arc logo__arc--outer" viewBox="0 0 730 270" preserveAspectRatio="none" focusable="false">
            <defs><linearGradient id="logo-day-arc1-grad"><stop stop-color="#a78a60" stop-opacity=".35"/><stop offset=".67" stop-color="#f5da9b"/><stop offset="1" stop-color="#a78a60" stop-opacity=".35"/></linearGradient></defs>
            <path d="M 217 224 C 207 157 233 94 287 61 C 360 15 452 51 501 139" fill="none" stroke="url(#logo-day-arc1-grad)" stroke-width="1.35" pathLength="1"/>
          </svg>
          <svg class="logo__layer logo__arc logo__arc--inner" viewBox="0 0 730 270" preserveAspectRatio="none" focusable="false">
            <defs><linearGradient id="logo-day-arc2-grad"><stop stop-color="#a78a60" stop-opacity=".35"/><stop offset=".67" stop-color="#f5da9b"/><stop offset="1" stop-color="#a78a60" stop-opacity=".35"/></linearGradient></defs>
            <path d="M 225 144 C 255 97 306 73 354 73 C 404 73 444 94 475 126" fill="none" stroke="url(#logo-day-arc2-grad)" stroke-width="0.85" pathLength="1"/>
          </svg>
          <span class="logo__layer logo__letter logo__letter--l"><img class="logo__img" src="assets/ui/logo/day/L.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__letter logo__letter--i"><img class="logo__img" src="assets/ui/logo/day/I.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__letter logo__letter--f"><img class="logo__img" src="assets/ui/logo/day/F.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__letter logo__letter--e"><img class="logo__img" src="assets/ui/logo/day/E.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__shine"></span>
          <span class="logo__layer logo__aura"></span>
          <span class="logo__layer logo__center"><img class="logo__img" src="assets/ui/logo/day/center.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__star logo__star--1"><img class="logo__img" src="assets/ui/logo/day/orbit-star-1.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__star logo__star--2"><img class="logo__img" src="assets/ui/logo/day/orbit-star-2.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__side logo__side--left"><img class="logo__img" src="assets/ui/logo/day/left.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__side logo__side--right"><img class="logo__img" src="assets/ui/logo/day/right.png" alt="" width="730" height="270" decoding="async"></span>
        </span>
        <!-- night: 레이어 순서는 리소스 README 의 합성 순서를 따른다 -->
        <span class="logo__theme logo__theme--night only-night">
          <svg class="logo__layer logo__arc logo__arc--outer" viewBox="0 0 730 270" preserveAspectRatio="none" focusable="false">
            <defs><linearGradient id="logo-night-arc1-grad"><stop stop-color="#728a99" stop-opacity=".35"/><stop offset=".67" stop-color="#e4edf4"/><stop offset="1" stop-color="#3a566b" stop-opacity=".35"/></linearGradient></defs>
            <path d="M 217 224 C 207 157 233 94 287 61 C 360 15 452 51 501 139" fill="none" stroke="url(#logo-night-arc1-grad)" stroke-width="1.35" pathLength="1"/>
          </svg>
          <svg class="logo__layer logo__arc logo__arc--inner" viewBox="0 0 730 270" preserveAspectRatio="none" focusable="false">
            <defs><linearGradient id="logo-night-arc2-grad"><stop stop-color="#728a99" stop-opacity=".35"/><stop offset=".67" stop-color="#e4edf4"/><stop offset="1" stop-color="#3a566b" stop-opacity=".35"/></linearGradient></defs>
            <path d="M 225 144 C 255 97 306 73 354 73 C 404 73 444 94 475 126" fill="none" stroke="url(#logo-night-arc2-grad)" stroke-width="0.85" pathLength="1"/>
          </svg>
          <span class="logo__layer logo__letter logo__letter--l"><img class="logo__img" src="assets/ui/logo/night/L.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__letter logo__letter--i"><img class="logo__img" src="assets/ui/logo/night/I.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__letter logo__letter--f"><img class="logo__img" src="assets/ui/logo/night/F.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__letter logo__letter--e"><img class="logo__img" src="assets/ui/logo/night/E.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__shine"></span>
          <span class="logo__layer logo__aura"></span>
          <span class="logo__layer logo__center"><img class="logo__img" src="assets/ui/logo/night/center.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__star logo__star--1"><img class="logo__img" src="assets/ui/logo/night/orbit-star-1.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__star logo__star--2"><img class="logo__img" src="assets/ui/logo/night/orbit-star-2.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__side logo__side--left"><img class="logo__img" src="assets/ui/logo/night/left.png" alt="" width="730" height="270" decoding="async"></span>
          <span class="logo__layer logo__side logo__side--right"><img class="logo__img" src="assets/ui/logo/night/right.png" alt="" width="730" height="270" decoding="async"></span>
        </span>

        <!-- 물 반사: letters-only.png 만 뒤집어 LIFE 글자만 비친다 -->
        <span class="logo__reflection">
          <img class="logo__img only-day" src="assets/ui/logo/day/letters-only.png" alt="" width="730" height="270" decoding="async">
          <img class="logo__img only-night" src="assets/ui/logo/night/letters-only.png" alt="" width="730" height="270" decoding="async">
        </span>
      </span>
    </h1>

    <div class="title-menu" role="group" data-i18n-attr="aria-label:title.menu" aria-label="타이틀 메뉴">

      <button class="menu-btn" id="start-btn" type="button">
        <svg class="menu-btn__frame" viewBox="0 0 500 84" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="btn-panel" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" class="stop-panel-1" />
              <stop offset="1" class="stop-panel-2" />
            </linearGradient>
            <linearGradient id="btn-sheen" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fff" stop-opacity="0" />
              <stop offset="0.5" stop-color="#fff" stop-opacity="0.55" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="btn-charge" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" class="stop-charge-1" />
              <stop offset="1" class="stop-charge-2" />
            </linearGradient>
            <clipPath id="btn-clip">
              <path d="M52 6 H448 L476 42 L448 78 H52 L24 42 Z" />
            </clipPath>
          </defs>
          <path class="frame-panel" d="M52 6 H448 L476 42 L448 78 H52 L24 42 Z" />
          <g clip-path="url(#btn-clip)">
            <rect class="frame-sheen" x="-160" y="0" width="140" height="84" />
          </g>
          <!-- 클릭 시 왼쪽에서 오른쪽으로 차오르는 색 (경계면은 잔잔한 물결) -->
          <g clip-path="url(#btn-clip)">
            <g class="frame-charge">
              <path class="frame-charge__fill" d="M-520 0 H0 Q7 10.5 0 21 T0 42 T0 63 T0 84 H-520 Z">
                <animate attributeName="d" dur="0.7s" repeatCount="indefinite"
                  values="M-520 0 H0 Q7 10.5 0 21 T0 42 T0 63 T0 84 H-520 Z;M-520 0 H0 Q-7 10.5 0 21 T0 42 T0 63 T0 84 H-520 Z;M-520 0 H0 Q7 10.5 0 21 T0 42 T0 63 T0 84 H-520 Z" />
              </path>
              <path class="frame-charge__edge" d="M0 0 Q7 10.5 0 21 T0 42 T0 63 T0 84">
                <animate attributeName="d" dur="0.7s" repeatCount="indefinite"
                  values="M0 0 Q7 10.5 0 21 T0 42 T0 63 T0 84;M0 0 Q-7 10.5 0 21 T0 42 T0 63 T0 84;M0 0 Q7 10.5 0 21 T0 42 T0 63 T0 84" />
              </path>
            </g>
          </g>
          <path class="frame-outer" d="M52 6 H448 L476 42 L448 78 H52 L24 42 Z" />
          <path class="frame-inner" d="M58 12 H442 L464 42 L442 72 H58 L36 42 Z" />
          <g class="frame-orn">
            <path d="M24 42 Q34 26 52 20 M24 42 Q34 58 52 64" />
            <path d="M476 42 Q466 26 448 20 M476 42 Q466 58 448 64" />
            <path class="frame-gem" d="M11 42 L17 32 L23 42 L17 52 Z" />
            <path class="frame-gem" d="M489 42 L483 32 L477 42 L483 52 Z" />
            <path d="M0 42 H11 M489 42 H500" />
          </g>
        </svg>
        <svg class="menu-btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5 L20 12 L6 20.5 Z" /></svg>
        <span class="menu-btn__label" data-i18n="title.start">시작하기</span>
      </button>

      <div class="settings-row">
        <div class="setting" role="group" data-i18n-attr="aria-label:settings.languageGroup" aria-label="언어 선택">
          <svg class="setting__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" /><path d="M3 12 H21 M12 3 C8 7 8 17 12 21 M12 3 C16 7 16 17 12 21" />
          </svg>
          <span class="setting__label" data-i18n="settings.language" aria-hidden="true">언어</span>
          <span class="seg">
            <button class="seg__btn" type="button" data-lang="ko" aria-pressed="true" lang="ko" aria-label="한국어">KR</button>
            <span class="seg__sep" aria-hidden="true">/</span>
            <button class="seg__btn" type="button" data-lang="en" aria-pressed="false" lang="en" aria-label="English">EN</button>
          </span>
        </div>

        <span class="settings-row__divider" aria-hidden="true"></span>

        <div class="setting">
          <span class="setting__icon setting__icon--theme" aria-hidden="true">
            <svg class="only-night" viewBox="0 0 24 24"><path d="M15.5 3.2 A9 9 0 1 0 20.8 15.4 A7 7 0 0 1 15.5 3.2 Z" /></svg>
            <svg class="only-day" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" /><path d="M12 2 V5 M12 19 V22 M2 12 H5 M19 12 H22 M4.9 4.9 L7 7 M17 17 L19.1 19.1 M19.1 4.9 L17 7 M7 17 L4.9 19.1" /></svg>
          </span>
          <span class="setting__label" id="theme-label" data-i18n="settings.night">밤 테마</span>
          <button class="switch" id="theme-switch" type="button" role="switch" data-theme-toggle aria-checked="true" aria-labelledby="theme-label">
            <span class="switch__thumb"></span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- 로고 반사광의 물결 왜곡 필터 -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <filter id="water-ripple" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.09" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" dur="9s" values="0.006 0.09; 0.009 0.12; 0.006 0.09" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="screen-fade" aria-hidden="true"></div>

  <script src="js/i18n/ko.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/theme.js"></script>
  <script src="js/core/transition.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/core/controls.js"></script>
  <script src="js/config/illustration.js"></script>
  <script src="js/effects/particles.js"></script>
  <script src="js/title/illustration.js"></script>
  <script src="js/title/title.js"></script>
</body>
</html>
