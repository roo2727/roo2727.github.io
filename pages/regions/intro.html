<!doctype html>
<html lang="ko" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIFE — 자기소개</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Diphylleia&family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@500&family=Song+Myung&display=swap">
  <!-- Pretendard (SIL OFL 1.1): 일반 본문·보조 UI -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <link rel="stylesheet" href="../../css/base.css">
  <!-- 상세 페이지 공통 컴포넌트 (여섯 지역 페이지가 함께 쓴다) -->
  <link rel="stylesheet" href="../../css/detail.css">
  <!-- 01 자기소개 전용 배치 -->

  <script src="../../js/dev/font-preview.js"></script>

<!--
  01 자기소개 — 시네마틱 판타지 상세 페이지
  · 배경 일러스트: assets/regions/intro/bg-day.png, bg-night.png (아래 .detail-bg 의 두 <img>)
  · 글: js/i18n/ko.js, en.js 의 'about.*' (HTML 안의 글은 기본값)
  · 장식(별, 곡선, 프레임)은 모두 aria-hidden SVG/CSS 로 글과 분리되어 있다.
-->
<body class="page-detail page-intro" data-region="intro">
  <!-- ================= 배경 (낮·밤 별도 이미지) ================= -->
  <div class="detail-bg" aria-hidden="true">
    <img class="detail-bg__img only-day" src="../../assets/regions/intro/bg-day.png" alt="" width="1672" height="941">
    <img class="detail-bg__img only-night" src="../../assets/regions/intro/bg-night.png" alt="" width="1672" height="941">
    <div class="detail-bg__shade"></div>
  </div>

  <div class="detail">
    <!-- ================= 공통 헤더 ================= -->
    <header class="detail-head">
      <a class="d-btn d-btn--small" href="../lobby.html" data-transition>
        <svg class="d-btn__arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" /></svg>
        <span data-i18n="detail.backToMap">월드맵</span>
      </a>

      <div class="detail-head__side">
        <span class="seg" role="group" data-i18n-attr="aria-label:settings.languageGroup" aria-label="언어 선택">
          <button class="seg__btn" type="button" data-lang="ko" aria-pressed="true" lang="ko" aria-label="한국어">KR</button>
          <button class="seg__btn" type="button" data-lang="en" aria-pressed="false" lang="en" aria-label="English">EN</button>
        </span>
        <button class="theme-btn" type="button" role="switch" aria-checked="true" data-theme-toggle data-i18n-attr="aria-label:detail.themeToggle" aria-label="낮/밤 테마 전환">
          <svg class="only-night" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.5 A8.5 8.5 0 1 0 20.5 15 A7 7 0 0 1 15.5 3.5 Z" /></svg>
          <svg class="only-day" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" /></svg>
        </button>
        <span class="detail-head__rule" aria-hidden="true"></span>
        <p class="detail-head__page"><span class="visually-hidden" data-i18n="detail.page">페이지</span> <span class="js-page-num">01</span>/<span class="js-page-total">06</span></p>
      </div>
    </header>

    <!-- ================= 본문 ================= -->
    <main class="intro">
      <!-- 페이지 제목 -->
      <header class="d-title">
        <p class="d-kicker" lang="en" data-i18n="about.kicker">CHAPTER 01 · ABOUT ME</p>
        <h1 class="d-title__main">
          <svg class="d-star d-title__star" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 0 L22.6 17.4 L40 20 L22.6 22.6 L20 40 L17.4 22.6 L0 20 L17.4 17.4 Z" /></svg>
          <span data-i18n="about.title">나라는 세계의 시작</span>
        </h1>
        <!-- 제목을 감싸는 곡선과 작은 별 (장식) -->
        <svg class="d-title__swoosh" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true">
          <path d="M10 112 C 120 70, 330 66, 520 52 C 600 46, 610 10, 560 4" />
          <path class="d-star" d="M548 46 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" />
        </svg>
        <p class="d-title__sub">
          <span class="d-rule d-rule--left" aria-hidden="true"></span>
          <span data-i18n="about.subtitle">아이디어를 하나의 세계로.</span>
          <span class="d-rule d-rule--right" aria-hidden="true"></span>
        </p>
        <p class="d-title__lead" data-i18n="about.lead">게임 개발자를 꿈꾸는 컴퓨터공학도</p>
      </header>

      <!-- 키워드 태그 -->
      <ul class="d-tags" data-i18n-attr="aria-label:about.keywords" aria-label="나를 표현하는 키워드">
        <li class="d-tag">
          <span class="d-tag__emblem" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path class="fill" d="M16 3 L17.8 14.2 L29 16 L17.8 17.8 L16 29 L14.2 17.8 L3 16 L14.2 14.2 Z" /><path d="M16 9 L16 23 M9 16 L23 16" /></svg>
          </span>
          <span class="d-tag__label" data-i18n="about.kw1">탐구</span>
        </li>
        <li class="d-tag">
          <span class="d-tag__emblem" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M3 24 L12 11 L17 18 L21 13 L29 24 Z" /><path d="M10 14 L12 11 L14 14" /></svg>
          </span>
          <span class="d-tag__label" data-i18n="about.kw2">도전</span>
        </li>
        <li class="d-tag">
          <span class="d-tag__emblem" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M16 27 V14" /><path d="M16 15 C 16 9, 11 7, 6 8 C 6 13, 10 16, 16 15 Z" /><path d="M16 15 C 16 9, 21 7, 26 8 C 26 13, 22 16, 16 15 Z" /></svg>
          </span>
          <span class="d-tag__label" data-i18n="about.kw3">성장</span>
        </li>
      </ul>

      <!-- 정보 영역: 2열 × 2행 -->
      <div class="intro__grid">
        <!-- 기본 정보 -->
        <section class="d-sec intro__basic" aria-labelledby="sec-basic">
          <h2 class="d-sec__title" id="sec-basic"><span data-i18n="about.basic">기본 정보</span></h2>
          <dl class="d-facts">
            <div class="d-fact">
              <dt><svg class="d-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4.5 20.5 C5.5 15.5 8.5 13.5 12 13.5 C15.5 13.5 18.5 15.5 19.5 20.5" /></svg><span data-i18n="about.label.name">이름</span></dt>
              <dd data-i18n="about.value.name">[이름]</dd>
            </div>
            <div class="d-fact">
              <dt><svg class="d-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9 L12 4 L21 9 Z" /><path d="M5 10 V17 M9.5 10 V17 M14.5 10 V17 M19 10 V17 M3 20 H21 M4 17.5 H20" /></svg><span data-i18n="about.label.school">학교</span></dt>
              <dd data-i18n="about.value.school">[학교]</dd>
            </div>
            <div class="d-fact">
              <dt><svg class="d-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 L21 8.5 L12 13 L3 8.5 Z" /><path d="M3 12.5 L12 17 L21 12.5 M3 16.5 L12 21 L21 16.5" /></svg><span data-i18n="about.label.major">전공</span></dt>
              <dd data-i18n="about.value.major">컴퓨터공학과</dd>
            </div>
            <div class="d-fact">
              <dt><svg class="d-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 L22 10 L12 15 L2 10 Z" /><path d="M6 12 V16.5 C8 18.5 16 18.5 18 16.5 V12 M21 10.5 V15" /></svg><span data-i18n="about.label.grade">학년</span></dt>
              <dd data-i18n="about.value.grade">2학년</dd>
            </div>
            <div class="d-fact">
              <dt><svg class="d-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><circle cx="12" cy="12" r="5" /><circle cx="12" cy="12" r="1.5" /><path d="M12 12 L20 4 M17 4 H20 V7" /></svg><span data-i18n="about.label.dream">희망 직업</span></dt>
              <dd data-i18n="about.value.dream">게임 개발자</dd>
            </div>
          </dl>
        </section>

        <!-- 자기소개 -->
        <section class="d-sec intro__story" aria-labelledby="sec-intro">
          <h2 class="d-sec__title" id="sec-intro"><span data-i18n="about.intro">자기소개</span></h2>
          <div class="d-prose">
            <p data-i18n="about.intro1">안녕하세요.</p>
            <p data-i18n="about.intro2"></p>
          </div>
        </section>

        <!-- 성격 및 장단점 -->
        <section class="d-sec intro__traits" aria-labelledby="sec-traits">
          <h2 class="d-sec__title" id="sec-traits"><span data-i18n="about.traits">성격 및 장단점</span></h2>
          <dl class="d-traits">
            <div class="d-trait">
              <dt>
                <span class="d-emblem" aria-hidden="true"><svg viewBox="0 0 32 32"><path class="fill" d="M16 4 L17.6 14.4 L28 16 L17.6 17.6 L16 28 L14.4 17.6 L4 16 L14.4 14.4 Z" /></svg></span>
                <span data-i18n="about.trait.personality">성격</span>
              </dt>
              <dd data-i18n="about.trait.personalityText"></dd>
            </div>
            <div class="d-trait">
              <dt>
                <span class="d-emblem d-emblem--bare" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M2 25 L11 11 L16 18 L20 13 L30 25 Z" /><path d="M9 14 L11 11 L13 14" /></svg></span>
                <span data-i18n="about.trait.strength">장점</span>
              </dt>
              <dd data-i18n="about.trait.strengthText"></dd>
            </div>
            <div class="d-trait">
              <dt>
                <span class="d-emblem" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 27 V14" /><path d="M16 15 C 16 9, 11 7, 6 8 C 6 13, 10 16, 16 15 Z" /><path d="M16 15 C 16 9, 21 7, 26 8 C 26 13, 22 16, 16 15 Z" /></svg></span>
                <span data-i18n="about.trait.growth">보완점</span>
              </dt>
              <dd data-i18n="about.trait.growthText"></dd>
            </div>
          </dl>
        </section>

        <!-- 좌우명 -->
        <section class="d-sec intro__motto" aria-labelledby="sec-motto">
          <h2 class="d-sec__title" id="sec-motto"><span data-i18n="about.motto">좌우명</span></h2>
          <figure class="d-quote">
            <!-- 강조 프레임 (장식): 물결 테두리 + 위 별 + 아래 산 -->
            <svg class="d-quote__frame" viewBox="0 0 400 180" preserveAspectRatio="none" aria-hidden="true">
              <path d="M28 26 C 90 14, 150 30, 200 22 C 260 12, 320 28, 378 22 C 392 50, 384 90, 392 128 C 396 150, 384 160, 372 162 C 300 170, 240 156, 190 166 C 130 176, 70 160, 26 164 C 10 150, 18 110, 10 80 C 4 56, 12 34, 28 26 Z" />
              <path d="M34 34 C 92 24, 150 38, 200 30 C 258 22, 318 36, 370 30 C 382 56, 376 92, 382 126 C 384 144, 376 152, 366 154 C 298 162, 238 148, 190 158 C 132 166, 74 152, 34 156 C 22 142, 28 108, 20 80 C 16 58, 22 40, 34 34 Z" class="thin" />
            </svg>
            <svg class="d-quote__star d-star" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 0 L22.6 17.4 L40 20 L22.6 22.6 L20 40 L17.4 22.6 L0 20 L17.4 17.4 Z" /></svg>
            <svg class="d-quote__peaks" viewBox="0 0 200 30" aria-hidden="true"><path d="M0 30 L40 22 L62 10 L80 18 L100 2 L122 16 L140 9 L162 20 L200 30 Z" /></svg>
            <blockquote class="d-quote__text">
              <p><span data-i18n="about.motto1">상상에 머무르지 않고,</span><br><em data-i18n="about.motto2a">직접</em><span data-i18n="about.motto2b"> 만들어 나가자.</span></p>
            </blockquote>
          </figure>
        </section>
      </div>
    </main>

    <!-- ================= 공통 하단: 이전·다음 지역 + 진행 표시 ================= -->

    </nav>
