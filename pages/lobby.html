<!doctype html>
<html lang="ko" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.lobby">LIFE — 월드맵</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Gowun+Batang:wght@400;700&display=swap">
  <!-- Pretendard (SIL OFL 1.1): 일반 본문·보조 UI -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/lobby.css">

  <script src="../js/core/storage.js"></script>
  <script src="../js/core/boot.js"></script>
</head>
<body class="page-lobby">

  <!-- ===== 배경 일러스트 (UI 와 분리, js/config/worldmap.js 에서 교체) ===== -->
  <div class="map-bg" id="map-bg" aria-hidden="true"></div>
  <canvas class="particles" id="particles" aria-hidden="true"></canvas>

  <!-- ===== 좌측 73%: 월드맵 ===== -->
  <main class="map" id="map">
    <header class="map-title">
      <span class="map-title__glyph" aria-hidden="true">
        <!-- 밤: 달과 별자리 -->
        <svg class="only-night" viewBox="0 0 64 32" fill="none">
          <path class="glyph-fill" d="M14 4 A12 12 0 1 0 26 20 A9 9 0 0 1 14 4 Z" />
          <path class="glyph-line" d="M34 22 L44 12 L54 16 L62 8" />
          <circle class="glyph-dot" cx="34" cy="22" r="1.6" /><circle class="glyph-dot" cx="44" cy="12" r="1.8" />
          <circle class="glyph-dot" cx="54" cy="16" r="1.4" /><circle class="glyph-dot" cx="62" cy="8" r="1.6" />
        </svg>
        <!-- 낮: 태양과 바람 -->
        <svg class="only-day" viewBox="0 0 64 32" fill="none">
          <circle class="glyph-fill" cx="14" cy="16" r="6" />
          <path class="glyph-line" d="M14 3 V6 M14 26 V29 M1 16 H4 M24 16 H27 M5 7 L7 9 M21 23 L23 25 M23 7 L21 9 M7 23 L5 25" />
          <path class="glyph-line" d="M32 12 H52 a4 4 0 1 0 -4 -4 M32 20 H58 a4 4 0 1 1 -4 4" />
        </svg>
      </span>
      <div>
        <h1 class="map-title__name" data-i18n="lobby.mapTitle">월드맵</h1>
        <p class="map-title__hint" data-i18n="lobby.mapHint">탐험할 섬을 선택하세요</p>
      </div>
    </header>

    <!-- 확대 연출(입장) 시 이 요소 전체가 섬을 향해 확대된다 -->
    <div class="map-world" id="map-world">
      <svg class="map-routes" id="map-routes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="islands" id="islands" role="group" data-i18n-attr="aria-label:lobby.regions" aria-label="지역 목록"></div>
    </div>
  </main>

  <!-- ===== 우측 27%: 선택 지역 상세 정보 ===== -->
  <aside class="panel" id="panel" data-i18n-attr="aria-label:lobby.panel" aria-label="지역 정보">
    <span class="panel__corner panel__corner--tl" aria-hidden="true"></span>
    <span class="panel__corner panel__corner--tr" aria-hidden="true"></span>
    <span class="panel__corner panel__corner--bl" aria-hidden="true"></span>
    <span class="panel__corner panel__corner--br" aria-hidden="true"></span>

    <div class="panel__top">
      <a class="panel__back" href="../index.html" data-transition>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" /></svg>
        <span data-i18n="lobby.back">타이틀</span>
      </a>
      <div class="panel__settings" role="group" data-i18n-attr="aria-label:lobby.settings" aria-label="설정">
        <span class="seg">
          <button class="seg__btn" type="button" data-lang="ko" aria-pressed="true" lang="ko" aria-label="한국어">KR</button>
          <span class="seg__sep" aria-hidden="true">/</span>
          <button class="seg__btn" type="button" data-lang="en" aria-pressed="false" lang="en" aria-label="English">EN</button>
        </span>
        <button class="switch" type="button" role="switch" aria-checked="true" data-theme-toggle data-i18n-attr="aria-label:settings.night" aria-label="밤 테마">
          <span class="switch__thumb"></span>
        </button>
      </div>
    </div>

    <div class="panel__nav">
      <button class="nav-arrow" id="prev-btn" type="button" data-i18n-attr="aria-label:lobby.prev" aria-label="이전 지역">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" /></svg>
      </button>
      <span class="panel__count" aria-hidden="true"><b id="region-index">01</b> / <span id="region-total">06</span></span>
      <button class="nav-arrow" id="next-btn" type="button" data-i18n-attr="aria-label:lobby.next" aria-label="다음 지역">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L11 8 L6 13" /></svg>
      </button>
    </div>

    <section class="panel__body" id="region-info" aria-live="polite">
      <p class="region__tagline" id="region-tagline"></p>
      <h2 class="region__name" id="region-name"></h2>
      <p class="region__status" id="region-status"></p>
      <p class="region__desc" id="region-desc"></p>
      <h3 class="region__label" data-i18n="lobby.keywords">키워드</h3>
      <ul class="region__keywords" id="region-keywords"></ul>
    </section>

    <button class="enter-btn" id="enter-btn" type="button">
      <span data-i18n="lobby.enter">입장하기</span>
    </button>
    <p class="panel__hint" data-i18n="lobby.keyHint" aria-hidden="true">← → 지역 이동 · Enter 입장</p>

    <footer class="progress">
      <div class="progress__head">
        <span data-i18n="lobby.progress">탐험 진행도</span>
        <span class="progress__value" id="progress-value">0 / 6</span>
      </div>
      <div class="progress__bar" role="progressbar" id="progress-bar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0" data-i18n-attr="aria-label:lobby.progress" aria-label="탐험 진행도">
        <span class="progress__fill" id="progress-fill"></span>
      </div>
      <ol class="progress__dots" id="progress-dots" aria-hidden="true"></ol>
    </footer>
  </aside>

  <div class="screen-fade" aria-hidden="true"></div>

  <script src="../js/i18n/ko.js"></script>
  <script src="../js/i18n/en.js"></script>
  <script src="../js/core/i18n.js"></script>
  <script src="../js/core/theme.js"></script>
  <script src="../js/core/transition.js"></script>
  <script src="../js/core/session.js"></script>
  <script src="../js/core/controls.js"></script>
  <script src="../js/core/progress.js"></script>
  <script src="../js/config/worldmap.js"></script>
  <script src="../js/effects/particles.js"></script>
  <script src="../js/lobby/map.js"></script>
  <script src="../js/lobby/lobby.js"></script>
</body>
</html>
